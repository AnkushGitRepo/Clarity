<nav class="navbar" *ngIf="authService.isAuthenticated$ | async">
    <div class="navbar-brand">
        <img src="/assets/logo.png" width="32" height="32" alt="Clarity Logo" class="navbar-logo" />
        <h2>Clarity</h2>
    </div>
    <ul class="navbar-nav">
        <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
        <li><a routerLink="/tasks" routerLinkActive="active">Tasks</a></li>
        <li><a routerLink="/pomodoro" routerLinkActive="active">Pomodoro</a></li>
        <li><a routerLink="/analytics" routerLinkActive="active">Analytics</a></li>
    </ul>
    <div class="navbar-user">
        <span class="user-greeting">Hi, {{ authService.currentUser$ | async }}</span>
        <button class="btn btn-icon theme-toggle" (click)="themeService.toggleTheme()"
            [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
            <ng-container *ngIf="themeService.isDarkMode(); else lightIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
                </svg>
            </ng-container>
            <ng-template #lightIcon>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </ng-template>
        </button>
        <button class="btn btn-outline" (click)="authService.logout()">Logout</button>
    </div>
</nav>
