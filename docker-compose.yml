version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: clarity_mongodb
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarity_backend
    ports:
      - "5239:8080"
    environment:
      - MongoDB__ConnectionURI=mongodb://mongodb:27017
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clarity_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
